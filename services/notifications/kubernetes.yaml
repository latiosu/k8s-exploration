apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifications-service
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: notifications-service
  template:
    metadata:
      labels:
        app: notifications-service
    spec:
      containers:
        # - name: notifications-service
        #   image: notifications-service-image
        #   ports:
        #   - containerPort: 8001
        - name: mailhog-service
          image: mailhog/mailhog
          ports:
          - containerPort: 1025
